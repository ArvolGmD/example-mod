name: Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: nightly

      - uses: actions/upload-artifact@v4
        with:
          name: Mod
          path: ${{ steps.build.outputs.build-output }}
